services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_ledger}
      POSTGRES_USER: ${POSTGRES_USER:-cloud_ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud_ledger_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - cloud_ledger_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.1
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["migrate", "-path", "/migrations", "-database", "${DATABASE_URL:-postgres://cloud_ledger:cloud_ledger_dev@postgres:5432/cloud_ledger?sslmode=disable}"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgres://cloud_ledger:cloud_ledger_dev@postgres:5432/cloud_ledger?sslmode=disable}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-local-compose-access-secret-change-before-production}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-168h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${APP_PUBLISHED_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    profiles: ["tools"]
    entrypoint: ["/usr/local/bin/seed"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://cloud_ledger:cloud_ledger_dev@postgres:5432/cloud_ledger?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-local-compose-access-secret-change-before-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  cloud_ledger_postgres:
